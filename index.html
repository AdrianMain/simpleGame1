<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Szybkie palce</title>
</head>
<body>
    <h1 class="gameName">SZYBKIE PALCE THE GAME</h1> 
    <div class="points">
        <div class="g1">
            <div class="align">
                <p class="player">Gracz 1</p>
                <p id="p1" class="number">Punkty: 0</p>
            </div>
            <div id="block1"></div>
        </div>
        <div class="g2">
            <div class="align">
                <p class="player">Gracz 2</p>
                <p id="p2" class="number">Punkty: 0</p>
            </div>
            <div id="block2"></div>
        </div>
    </div>
    <div class="center">
        <div class="trafficLight" id="light"></div>
        <button id="start" onclick="startGame()" class="start">Start game</button>
    </div>
    <p id="info"></p>
    <p id="time"></p>
    
<script src="main.js"></script>
</body>
</html>
